[mysql]
host = book.db.baeoom.com
port = 3306
user = book_admin
password = your_password
database = onebabo_book
charset = utf8mb4

; 추천 댓글 생성(recommend) — Google AI Studio 무료 키
; https://aistudio.google.com/apikey
; api_key 를 비우면 GEMINI_API_KEY 환경변수 사용
; model = 시작 모델. 무료 한도(429)·모델 불가(404) 시 models 순서로 자동 전환
; models 미지정이면 코드 기본 우선순위(3.5-flash-lite → … → 2.5-pro)
[gemini]
api_key =
model = gemini-3.5-flash-lite
; models = gemini-3.5-flash-lite, gemini-3.5-flash, gemini-3.1-flash-lite, gemini-3.1-flash, gemini-2.5-flash-lite, gemini-2.5-flash, gemini-2.5-pro
; 모델 우선순위지정 (변경:2026-10-23)
; models = gemini-3.5-flash-lite, gemini-3.5-flash, gemini-3.1-flash-lite, gemini-3.1-flash, gemini-2.5-flash-lite, gemini-2.5-flash

